name: Deploy Duo DS to GitHub Pages
on:
  push:
    branches: ["main", "claude/eloquent-brahmagupta-k1aod9"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: duo-pages
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'aleph-void/EmulatorJS'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Minify
        run: npm run minify
      - name: Assemble site
        run: |
          mkdir -p _site/data/cores _site/docs
          cp duo.html _site/index.html
          cp -r duo _site/duo
          cp docs/favicon.ico _site/docs/
          cp -r data/compression data/localization data/src _site/data/
          cp data/loader.js data/version.json data/emulator.css data/emulator.min.js data/emulator.min.css _site/data/
          cp -r node_modules/@emulatorjs/core-melonds/*.data node_modules/@emulatorjs/core-melonds/reports _site/data/cores/
          echo "duo-ds.alephvoid.com" > _site/CNAME
          touch _site/.nojekyll
      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
